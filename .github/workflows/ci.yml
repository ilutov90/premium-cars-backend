# Build and test on every push to main and every pull request.
# GitHub's Ubuntu runners have Docker, so JdbcRepositoriesTest runs against a real PostgreSQL (Testcontainers).
# Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 (Oct 2026), whose Docker refuses the API version of the
# Testcontainers in the Spring Boot BOM, so the database tests were skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
      - name: Test summary
        if: always()
        shell: python3 {0}
        run: |
          import glob, sys, xml.etree.ElementTree as ET
          # One notice for all classes: GitHub shows at most 10 notices per step.
          skipped_db = False
          total = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          lines = []
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              s = ET.parse(f).getroot()
              name = s.get("name").rsplit(".", 1)[-1]
              counts = {k: int(s.get(k, 0)) for k in total}
              for k in total:
                  total[k] += counts[k]
              lines.append(f"{name} {counts['tests']}" + (f" (skipped {counts['skipped']})" if counts["skipped"] else ""))
              if name == "JdbcRepositoriesTest" and counts["skipped"]:
                  skipped_db = True
          # one error per failed test, with the start of its message (the logs are not always at hand)
          for f in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              for case in ET.parse(f).getroot().iter("testcase"):
                  for bad in list(case.findall("failure")) + list(case.findall("error")):
                      text = (bad.get("message") or bad.text or "").replace("\n", " ").replace("%", "%25")[:900]
                      print(f"::error title={case.get('classname', '').rsplit('.', 1)[-1]}.{case.get('name')}::{text}")
          summary = " ".join(f"{k}={v}" for k, v in total.items())
          print(f"::notice title=Tests {summary}::" + ", ".join(lines))
          if skipped_db:
              print("::error title=JdbcRepositoriesTest::database tests were skipped (Docker not available)")
              sys.exit(1)

  # Blocks commits that contain passwords, tokens or keys (scans the whole history of the branch)
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The production image: built on every pull request (so a broken Dockerfile shows up early), pushed to
  # ghcr.io/ilutov90/premium-cars-backend on main as :latest and :<commit>. The server pulls it when deployed.
  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ilutov90/premium-cars-backend:latest
            ghcr.io/ilutov90/premium-cars-backend:${{ github.sha }}
          load: ${{ github.event_name == 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Headless Chromium starts in the image, as the non-root app user
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint sh ghcr.io/ilutov90/premium-cars-backend:latest -c \
            'id -un && ls /ms-playwright && $(ls -d /ms-playwright/chromium-*/chrome-linux*/chrome | head -1) --headless=new --no-sandbox --disable-gpu --dump-dom about:blank'
