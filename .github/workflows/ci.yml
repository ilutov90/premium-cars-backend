# Build and test on every push to main and every pull request.
# GitHub's Ubuntu runners have Docker, so JdbcRepositoriesTest runs against a real PostgreSQL (Testcontainers).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
