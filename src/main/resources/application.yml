# Local defaults. Every value can be overridden with an environment variable,
# e.g. SPRING_DATASOURCE_URL, APP_ADMIN_PASSWORD, APP_IMPORTER_BROWSER_ENABLED.

server:
  port: 8080

spring:
  application:
    name: premium-cars-backend
  config:
    # Local secrets (e.g. AUTOWINI_USER / AUTOWINI_PASS) from a .env file next to pom.xml.
    # The file is git-ignored; in production use real environment variables instead.
    import: optional:file:.env[.properties]
  datasource:
    # PostgreSQL from premium-cars-infra/docker-compose.yml (host port 5433 so it does not clash with a local 5432)
    url: jdbc:postgresql://localhost:5433/premiumcars
    username: premiumcars
    password: premiumcars
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # "demo" inserts three sample cars so the site is not empty on first start. Set to "none" to skip.
    contexts: ${LIQUIBASE_CONTEXTS:demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.premiumcars: DEBUG

app:
  admin:
    username: admin
    password: ${APP_ADMIN_PASSWORD:admin123} # change it; never commit a real password
  cors:
    allowed-origins:
      - http://localhost:3000
  media:
    dir: ./data/media
    base-url: http://localhost:8080/media/
  importer:
    # Exactly the posting script's user agent. autowini answered 403 (pages and photos) to the same requests
    # sent with "Chrome/141.0" while the script's requests went through.
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
    timeout-seconds: 20
    max-images: 30
    browser:
      # Headless Chromium (Playwright) for photos and EV data that sites load with JavaScript.
      # Downloaded automatically on first use (~150 MB). Set to false to skip it.
      enabled: ${APP_IMPORTER_BROWSER_ENABLED:true}
      timeout-seconds: 60
    autowini:
      # Same variable names as autowini_poster.py's .env, so one file can serve both.
      username: ${AUTOWINI_USER:}
      password: ${AUTOWINI_PASS:}
  pricing:
    # Costs and profit per site are in the database (admin panel -> "Цени"), see PriceCalculator.
    exchange-rates:              # EUR per 1 unit — update regularly (later: fetch daily from the ECB)
      USD: 0.86
      CNY: 0.12
      KRW: 0.00061
