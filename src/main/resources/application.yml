# Local defaults, no secrets. Secrets come from Vault (see spring.config.import); every value can be
# overridden with an environment variable, e.g. VAULT_ADDR, APP_SECURE_COOKIES, APP_IMPORTER_BROWSER_ENABLED.

server:
  port: 8080
  # Behind the frontend / a reverse proxy: take the client IP from X-Forwarded-For of trusted (private) proxies
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 8h
      cookie:
        name: PC_SESSION
        http-only: true
        same-site: strict
        secure: ${APP_SECURE_COOKIES:false}

spring:
  application:
    name: premium-cars-backend
  config:
    import:
      # Local, non-secret overrides (e.g. VAULT_ADDR) from a git-ignored .env next to pom.xml. No secrets in it.
      - optional:file:.env[.properties]
      # AppRole credentials written by premium-cars-infra (docker compose up). In production set
      # SPRING_CLOUD_VAULT_APP_ROLE_ROLE_ID / _SECRET_ID as environment variables instead.
      - optional:file:../premium-cars-infra/vault/secrets/backend-approle.properties
      # All secrets: secret/premium-cars/backend in Vault. Keys = the placeholders below (DB_PASSWORD, AUTOWINI_USER ...).
      - optional:vault://
  cloud:
    vault:
      enabled: ${VAULT_ENABLED:true}
      uri: ${VAULT_ADDR:http://127.0.0.1:8200}
      authentication: APPROLE
      # Start fails with a clear error when Vault is down, sealed or refuses the AppRole (instead of running without secrets)
      fail-fast: true
      kv:
        enabled: true
        backend: secret
        application-name: premium-cars/backend
        default-context: premium-cars/backend
  datasource:
    # PostgreSQL from premium-cars-infra/docker-compose.yml (host port 5433 so it does not clash with a local 5432).
    # Credentials come from Vault; there is no default password.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/premiumcars}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # "demo" inserts three sample cars so the site is not empty on first start. Set to "none" to skip.
    contexts: ${LIQUIBASE_CONTEXTS:demo}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # API docs; turn off in production (APP_API_DOCS=false)
  api-docs:
    enabled: ${APP_API_DOCS:true}
  swagger-ui:
    enabled: ${APP_API_DOCS:true}
    path: /swagger-ui.html

logging:
  level:
    com.premiumcars: DEBUG

app:
  admin:
    # Only used when there is no admin user yet: creates "admin" with this password (generated by the infra
    # Vault setup). Change it in the admin panel afterwards; the hash lives in the admin_user table.
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
    # Secure cookies (HTTPS only). false locally (http://localhost), true in production.
    secure-cookies: ${APP_SECURE_COOKIES:false}
  cors:
    # Browsers reach the API through the frontend (same origin: Next.js forwards /api and /media), so no
    # cross-origin access is needed. Kept for read-only access to /media from other origins, if ever needed.
    allowed-origins: []
  media:
    dir: ./data/media
    # Relative: the browser loads photos through the frontend (/media is forwarded to this backend)
    base-url: /media/
  importer:
    # Exactly the posting script's user agent. autowini answered 403 (pages and photos) to the same requests
    # sent with "Chrome/141.0" while the script's requests went through.
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
    timeout-seconds: 20
    max-images: 30
    browser:
      # Headless Chromium (Playwright) for photos and EV data that sites load with JavaScript.
      # Downloaded automatically on first use (~150 MB). Set to false to skip it.
      enabled: ${APP_IMPORTER_BROWSER_ENABLED:true}
      timeout-seconds: 60
    autowini:
      # Same variable names as autowini_poster.py's .env, so one file can serve both.
      username: ${AUTOWINI_USER:}
      password: ${AUTOWINI_PASS:}
  social:
    # Publishing to Facebook/Instagram from the admin panel. Same names as the posting script's .env;
    # leave empty to hide that network. See README "Facebook and Instagram".
    graph-version: v23.0
    facebook-page-id: ${FB_PAGE_ID:}
    access-token: ${FB_ACCESS_TOKEN:}
    instagram-user-id: ${IG_USER_ID:}
    imgbb-api-key: ${IMGBB_API_KEY:}
    max-photos: 10
    # Viber channel: token from the channel's Developer tools (README "Viber"); photos go through imgbb.
    viber-channel-token: ${VIBER_CHANNEL_TOKEN:}
    viber-max-photos: 6
  pricing:
    # Costs and profit per site are in the database (admin panel -> "Цени"), see PriceCalculator.
    exchange-rates:              # EUR per 1 unit — update regularly (later: fetch daily from the ECB)
      USD: 0.86
      CNY: 0.12
      KRW: 0.00061
