# Tests: no Vault (VaultConfigTest starts its own), the database comes from Testcontainers (@ServiceConnection).
spring.cloud.vault.enabled=false
app.admin.initial-password=test-admin-password-1
# Many logins from one test client; RateLimitFilterTest covers the limits.
app.rate-limit.enabled=false
# No network: the configured exchange rates (EcbExchangeRateProviderTest covers the ECB file)
app.pricing.ecb.enabled=false
app.social.schedule-initial-delay=PT10H
